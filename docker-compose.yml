version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - db-data:/app/data
    environment:
      - STORE_INTEL_DB=/app/data/store_intel.db

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - STORE_INTEL_API_URL=http://api:8000
      - STORE_INTEL_STORE_ID=STORE_1
    depends_on:
      - api

volumes:
  db-data:

# Note: pipeline.py is not containerized here — it needs access to a
# camera/video file (and often a display window for debugging), so
# it's meant to be run on the host:
#   python pipeline.py --video path/to/video.mp4 --api-url http://localhost:8000
